name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: builds and verifies the artefact without publishing anything.
  workflow_dispatch:

# A literal group, matching ci.yml, so the CI run this one calls cannot collide with
# it. Releases are never cancelled in flight: a half-published tag is worse than a
# queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing is published on a red build: the same lint, tests, audit and build that
  # guard a pull request have to pass on the tagged commit first.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # fetch-tags, because the release notes are read out of the annotated tag below
      # and the default shallow checkout of a ref does not guarantee the tag *object*.
      - name: Check out the plugin
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Set up the plugin
        uses: ./.github/actions/setup-plugin
        with:
          php-version: '8.2'

      # The tag is the release; a tag whose commit says a different version would
      # ship an update WordPress cannot reason about.
      - name: Check the tag matches the plugin version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="$( ./bin/check-version.sh "${{ github.ref_name }}" )"
          else
            version="$( ./bin/check-version.sh )"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version $version"

      - name: Build the plugin zip
        run: ./bin/build-zip.sh

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: woo-organization-accounts-pro-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/update.json
          if-no-files-found: error

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A tag such as v0.5.0-rc.1 is a pre-release.
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac

          # The annotated tag's message is the release notes, and the release notes are
          # this plugin's changelog: Updater tells every site admin that what changed is
          # "recorded with the release it shipped in", and points the View details modal
          # at /releases. --generate-notes cannot fill that in — it summarises merged
          # pull requests, and work here lands as direct commits, so v0.13.0 and v0.13.1
          # both published with a compare link and nothing else.
          #
          # Falling back rather than failing is deliberate. Publishing is gated on CI, so
          # anything that stops this step leaves a pushed tag with no release behind it —
          # the one state an installed copy cannot see at all, since update.json is the
          # only thing it reads. A thin release beats an invisible one.
          # Tested against the whole message, not its body: a one-line annotation still
          # says more than the compare link --generate-notes falls back to. Only a
          # lightweight tag, which has no message at all, takes the fallback.
          notes="--generate-notes"
          git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          if [ -n "$(tr -d '[:space:]' < "$RUNNER_TEMP/notes.md")" ]; then
            notes="--notes-file $RUNNER_TEMP/notes.md"
          fi

          # update.json rides along on every release under that exact name: it is what
          # /releases/latest/download/update.json resolves to, and the only thing an
          # installed copy of the plugin reads to discover this version. A release
          # published without it is invisible to every site already running the plugin.
          gh release create "$TAG" \
            dist/woo-organization-accounts-pro-"$VERSION".zip \
            dist/woo-organization-accounts-pro-"$VERSION".zip.sha256 \
            dist/update.json \
            --title "WooCommerce Organization Accounts Pro $VERSION" \
            --verify-tag \
            $notes \
            $prerelease
